services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
